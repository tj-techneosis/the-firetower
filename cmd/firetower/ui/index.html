<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Firetower</title>
<link rel="icon" id="icon" href="data:,">
<link rel="stylesheet" href="board.css">
<script src="board.js" defer></script>
</head>
<body>
<header class="top">
  <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.2 15 5.1 6.2A1.8 1.8 0 0 1 6.9 4.8h1.4A1.7 1.7 0 0 1 10 6.5V12M20.8 15l-1.9-8.8a1.8 1.8 0 0 0-1.8-1.4h-1.4A1.7 1.7 0 0 0 14 6.5V12M10 8.5h4M10 12h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="15.5" r="3.6" class="lens" stroke="currentColor" stroke-width="1.6"/><circle cx="17.5" cy="15.5" r="3.6" class="lens" stroke="currentColor" stroke-width="1.6"/></svg>
  <h1 tabindex="-1">Firetower</h1>
  <p class="summary" id="summary" aria-live="polite">Looking…</p>
  <p class="updated" id="updated"></p>
</header>
<nav class="views" id="views" aria-label="How the board is laid out">
  <div class="seg" role="group" aria-label="Show">
    <button type="button" data-view="place" aria-pressed="true">By place</button>
    <button type="button" data-view="tag" aria-pressed="false" hidden>By tag</button>
    <button type="button" data-view="attention" aria-pressed="false">Needs a look</button>
  </div>
  <label class="tagpick" hidden><span>Tag</span> <select id="tagpick"><option value="">every tag</option></select></label>
  <p class="shown" id="shown"></p>
  <p class="done-note" id="done" aria-hidden="true"></p>
</nav>
<p id="announce" class="sr-only" aria-live="polite"></p>
<noscript><p class="banner">The board needs JavaScript to show the lookouts. <code>firetower ls</code> shows them in a terminal.</p></noscript>
<div id="banners"></div>
<main id="board"></main>
<template id="empty">
  <section class="empty">
    <h2>No lookouts yet</h2>
    <p>A check reports one line, and it shows up here:</p>
    <pre tabindex="0">firetower set shop/deploy green "Live." --next 30m</pre>
    <p>Or wrap a check that knows nothing about the Firetower:</p>
    <pre tabindex="0">firetower run shop/up --next 7m -- curl -fsS -o /dev/null https://example.com/</pre>
  </section>
</template>
</body>
</html>
